<!DOCTYPE html>  <html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>ZIS Fitouts – Crafting Spaces Since 2005</title>  
<link rel="preconnect" href="https://fonts.googleapis.com">  
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">  
<style>  
:root {  
  --rg1: #c9a0a0;  
  --rg2: #d4a8b0;  
  --rg3: #e8c4c4;  
  --silver: #b8bcc8;  
  --cream: #faf8f6;  
  --cream2: #f4f1ee;  
  --cream3: #ede9e5;  
  --white: #ffffff;  
  --charcoal: #2a2a2a;  
  --dark-mid: #4a4a4a;  
  --muted: #8a8a8a;  
  --muted-light: #b0b0b0;  
  --grad: linear-gradient(135deg, #b8bcc8 0%, #c9a0a0 40%, #d4a8b0 60%, #e0b8b8 80%, #c8b8c8 100%);  
  --grad-soft: linear-gradient(135deg, rgba(184,188,200,0.12) 0%, rgba(201,160,160,0.12) 50%, rgba(212,168,176,0.12) 100%);  
  --grad-text: linear-gradient(135deg, #b8bcc8 0%, #c9a0a0 45%, #d4a8b0 70%, #c8b8c8 100%);  
}  
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}  
html{scroll-behavior:smooth;}  
body{background:var(--cream);color:var(--charcoal);font-family:'Jost',sans-serif;font-weight:300;overflow-x:hidden;}  /* ── CURSOR ── */
.cursor{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);background:var(--rg1);transition:transform 0.1s;}
.cursor-ring{position:fixed;width:30px;height:30px;border:1.5px solid rgba(201,160,160,0.6);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width 0.3s,height 0.3s,border-color 0.3s;}
.cursor-ring.hovered{width:48px;height:48px;border-color:var(--rg1);}

/* ── NOISE OVERLAY ── */
body::before{content:'';position:fixed;inset:0;z-index:1000;pointer-events:none;opacity:0.025;
background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ── NAV ── */
nav{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:22px 60px;transition:all 0.5s cubic-bezier(0.4,0,0.2,1);}
nav.scrolled{background:rgba(250,248,246,0.94);backdrop-filter:blur(20px);padding:14px 60px;border-bottom:1px solid rgba(201,160,160,0.18);box-shadow:0 4px 48px rgba(201,160,160,0.1);}
.nav-logo{display:flex;align-items:center;gap:14px;text-decoration:none;}
.nav-logo img{height:50px;width:50px;object-fit:contain;border-radius:4px;}
.nav-logo-text{display:flex;flex-direction:column;line-height:1.1;}
.nav-logo-name{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:600;letter-spacing:0.12em;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-logo-sub{font-size:0.58rem;letter-spacing:0.32em;text-transform:uppercase;color:var(--muted);}
.nav-links{display:flex;gap:34px;list-style:none;}
.nav-links a{font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--dark-mid);text-decoration:none;transition:color 0.3s;font-weight:400;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;right:0;height:1px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);}
.nav-links a:hover{color:var(--rg1);}
.nav-links a:hover::after{transform:scaleX(1);}
.nav-right{display:flex;align-items:center;gap:20px;}
.nav-wa{display:flex;align-items:center;gap:8px;font-size:0.7rem;letter-spacing:0.12em;color:var(--charcoal);text-decoration:none;font-weight:400;transition:color 0.3s;}
.nav-wa:hover{color:#25d366;}
.nav-wa svg{width:18px;height:18px;fill:#25d366;}
.nav-cta{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--white);background:var(--grad);border:none;padding:12px 28px;text-decoration:none;font-weight:400;transition:opacity 0.3s,transform 0.2s;font-family:'Jost',sans-serif;cursor:pointer;display:inline-block;}
.nav-cta:hover{opacity:0.85;transform:translateY(-1px);}

/* ── HERO ── */
.hero{min-height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.08);animation:heroZoom 12s ease-out forwards;}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(105deg,rgba(250,248,246,0.96) 0%,rgba(250,248,246,0.88) 35%,rgba(250,248,246,0.3) 65%,rgba(250,248,246,0.05) 100%);}
.hero-content{position:relative;z-index:2;padding:0 60px;max-width:700px;padding-top:80px;}
.hero-eyebrow{display:flex;align-items:center;gap:14px;font-size:0.63rem;letter-spacing:0.38em;text-transform:uppercase;color:var(--rg1);margin-bottom:26px;opacity:0;animation:fadeUp 0.8s 0.3s ease forwards;}
.hero-eyebrow-line{width:40px;height:1px;background:var(--grad);}
.hero-title{font-family:'Cormorant Garamond',serif;font-size:clamp(3.4rem,6vw,7.2rem);font-weight:300;line-height:0.93;color:var(--charcoal);margin-bottom:10px;opacity:0;animation:fadeUp 0.9s 0.5s ease forwards;}
.hero-title em{font-style:italic;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-title-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.4vw,2rem);font-weight:300;font-style:italic;color:var(--muted);margin-bottom:32px;opacity:0;animation:fadeUp 0.8s 0.65s ease forwards;}
.hero-desc{font-size:0.92rem;line-height:1.95;color:var(--muted);max-width:420px;margin-bottom:48px;opacity:0;animation:fadeUp 0.8s 0.8s ease forwards;}
.hero-actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;opacity:0;animation:fadeUp 0.8s 0.95s ease forwards;}
.btn-primary{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--white);background:var(--grad);padding:16px 44px;text-decoration:none;font-family:'Jost',sans-serif;font-weight:400;transition:opacity 0.3s,transform 0.25s,box-shadow 0.3s;display:inline-block;box-shadow:0 8px 32px rgba(201,160,160,0.35);}
.btn-primary:hover{opacity:0.88;transform:translateY(-3px);box-shadow:0 14px 40px rgba(201,160,160,0.45);}
.btn-ghost{font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--charcoal);border:1px solid rgba(201,160,160,0.4);padding:16px 44px;text-decoration:none;font-family:'Jost',sans-serif;font-weight:400;transition:all 0.3s;display:inline-block;}
.btn-ghost:hover{border-color:var(--rg1);color:var(--rg1);background:rgba(201,160,160,0.06);}
.hero-scroll{position:absolute;bottom:40px;left:60px;display:flex;align-items:center;gap:14px;font-size:0.62rem;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted-light);z-index:2;opacity:0;animation:fadeIn 1s 1.6s forwards;}
.hero-scroll-line{width:50px;height:1px;background:linear-gradient(90deg,var(--rg1),transparent);animation:pulseWidth 2.5s ease-in-out infinite;}
.hero-badges{position:absolute;right:60px;bottom:60px;z-index:2;display:flex;flex-direction:column;gap:12px;opacity:0;animation:slideLeft 0.8s 1.2s ease forwards;}
.hero-badge{background:rgba(255,255,255,0.9);backdrop-filter:blur(12px);border:1px solid rgba(201,160,160,0.2);padding:18px 26px;box-shadow:0 8px 32px rgba(201,160,160,0.15);display:flex;align-items:center;gap:16px;}
.badge-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;line-height:1;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.badge-lbl{font-size:0.6rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);line-height:1.4;}

/* ── TICKER ── */
.ticker{background:var(--cream2);border-top:1px solid rgba(201,160,160,0.2);border-bottom:1px solid rgba(201,160,160,0.2);padding:13px 0;overflow:hidden;position:relative;z-index:2;}
.ticker-track{display:flex;animation:ticker 35s linear infinite;white-space:nowrap;}
.ticker-track:hover{animation-play-state:paused;}
.ticker-item{font-size:0.66rem;letter-spacing:0.3em;text-transform:uppercase;color:var(--muted);padding:0 32px;display:inline-flex;align-items:center;gap:32px;flex-shrink:0;}
.ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--grad);display:inline-block;flex-shrink:0;}

/* ── SHARED ── */
.section-label{display:flex;align-items:center;gap:14px;font-size:0.63rem;letter-spacing:0.35em;text-transform:uppercase;color:var(--rg1);margin-bottom:16px;}
.section-label-line{width:36px;height:1px;background:var(--grad);}
.section-title{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,3.5vw,3.8rem);font-weight:300;line-height:1.06;color:var(--charcoal);}
.section-title em{font-style:italic;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* ── SERVICES ── */
.services-section{padding:128px 60px;background:var(--white);}
.services-header{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:end;margin-bottom:72px;}
.services-header p{font-size:0.9rem;line-height:1.95;color:var(--muted);}
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;}

.svc-card{background:var(--cream);padding:0;position:relative;overflow:hidden;transition:all 0.45s cubic-bezier(0.4,0,0.2,1);border-bottom:3px solid transparent;cursor:default;display:flex;flex-direction:column;}
.svc-img{width:100%;height:220px;overflow:hidden;position:relative;}
.svc-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);}
.svc-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,transparent 40%,rgba(250,248,246,0.4) 100%);}
.svc-card:hover .svc-img img{transform:scale(1.08);}
.svc-body{padding:36px 36px 40px;flex:1;position:relative;}
.svc-body::before{content:'';position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity 0.4s;}
.svc-card:hover{background:var(--white);border-bottom-color:var(--rg1);box-shadow:0 12px 48px rgba(201,160,160,0.14);transform:translateY(-4px);}
.svc-card:hover .svc-body::before{opacity:1;}
.svc-num{font-family:'Cormorant Garamond',serif;font-size:3.8rem;font-weight:600;position:absolute;top:16px;right:22px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0.14;line-height:1;}
.svc-icon{margin-bottom:20px;position:relative;z-index:1;}
.svc-icon svg{width:36px;height:36px;stroke:var(--rg1);fill:none;stroke-width:1.3;}
.svc-name{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:400;color:var(--charcoal);margin-bottom:12px;position:relative;z-index:1;}
.svc-desc{font-size:0.83rem;line-height:1.85;color:var(--muted);position:relative;z-index:1;}
.svc-more{display:inline-flex;align-items:center;gap:8px;font-size:0.63rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--rg1);margin-top:24px;opacity:0;transform:translateX(-8px);transition:all 0.35s;position:relative;z-index:1;text-decoration:none;}
.svc-more svg{width:13px;height:13px;stroke:var(--rg1);stroke-width:1.8;fill:none;transition:transform 0.3s;}
.svc-card:hover .svc-more{opacity:1;transform:translateX(0);}
.svc-card:hover .svc-more svg{transform:translateX(5px);}
.svc-wide{grid-column:span 2;}

/* ── ABOUT STRIP ── */
.about-strip{display:grid;grid-template-columns:1fr 1fr;min-height:560px;}
.about-img{position:relative;overflow:hidden;}
.about-img img{width:100%;height:100%;object-fit:cover;transition:transform 8s ease;}
.about-img:hover img{transform:scale(1.04);}
.about-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,transparent 60%,rgba(244,241,238,0.95) 100%);}
.about-content{background:var(--cream2);padding:90px 72px;display:flex;flex-direction:column;justify-content:center;}
.about-quote{font-family:'Cormorant Garamond',serif;font-size:clamp(1.3rem,2.2vw,2rem);font-style:italic;font-weight:300;line-height:1.55;color:var(--charcoal);margin:28px 0 36px;position:relative;padding-left:28px;}
.about-quote::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--grad);}
.about-text{font-size:0.88rem;line-height:1.95;color:var(--muted);margin-bottom:40px;}

/* ── WHY ── */
.why-section{background:var(--white);padding:128px 60px;display:grid;grid-template-columns:5fr 4fr;gap:80px;align-items:start;}
.why-intro{font-size:0.9rem;line-height:1.95;color:var(--muted);max-width:460px;margin-top:26px;margin-bottom:52px;}
.why-features{display:flex;flex-direction:column;gap:3px;}
.why-feature{display:flex;gap:26px;align-items:flex-start;background:var(--cream);padding:26px 30px;border-left:3px solid transparent;transition:all 0.35s cubic-bezier(0.4,0,0.2,1);}
.why-feature:hover{border-left-color:var(--rg1);background:var(--white);box-shadow:4px 0 24px rgba(201,160,160,0.1);}
.why-feature-icon{width:42px;height:42px;flex-shrink:0;background:var(--grad-soft);display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform 0.3s;}
.why-feature:hover .why-feature-icon{transform:scale(1.1);}
.why-feature-icon svg{width:18px;height:18px;stroke:var(--rg1);fill:none;stroke-width:1.5;}
.why-feature-title{font-family:'Cormorant Garamond',serif;font-size:1.15rem;font-weight:400;color:var(--charcoal);margin-bottom:5px;}
.why-feature-desc{font-size:0.81rem;line-height:1.75;color:var(--muted);}
.why-right{}
.why-big-num{font-family:'Cormorant Garamond',serif;font-size:13rem;font-weight:600;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:0.8;position:absolute;top:-30px;left:-10px;pointer-events:none;opacity:0.06;}
.stats-visual{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding-top:48px;}
.stat-box{background:var(--cream);padding:40px 28px;text-align:center;position:relative;overflow:hidden;transition:all 0.35s;cursor:default;}
.stat-box:first-child{grid-column:span 2;}
.stat-box::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);}
.stat-box:hover{background:var(--white);box-shadow:0 4px 28px rgba(201,160,160,0.12);}
.stat-box:hover::after{transform:scaleX(1);}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:3.6rem;font-weight:300;line-height:1;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.stat-label{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-top:8px;line-height:1.5;}

/* ── PORTFOLIO ── */
.portfolio-section{padding:128px 60px;background:var(--cream2);}
.portfolio-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:300px 300px;gap:4px;margin-top:64px;}
.port-item{position:relative;overflow:hidden;cursor:default;}
.port-item:nth-child(1){grid-column:span 2;}
.port-item:nth-child(5){grid-column:span 2;}
.port-img{position:absolute;inset:0;}
.port-img img{width:100%;height:100%;object-fit:cover;transition:transform 0.8s cubic-bezier(0.4,0,0.2,1);}
.port-item:hover .port-img img{transform:scale(1.07);}
.port-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,18,16,0.78) 0%,rgba(20,18,16,0.1) 50%,transparent 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:32px 36px;transition:background 0.4s;}
.port-item:hover .port-overlay{background:linear-gradient(to top,rgba(20,18,16,0.85) 0%,rgba(20,18,16,0.2) 60%,transparent 100%);}
.port-tag{position:absolute;top:22px;left:22px;font-size:0.6rem;letter-spacing:0.22em;text-transform:uppercase;color:var(--charcoal);background:rgba(255,255,255,0.88);padding:6px 14px;backdrop-filter:blur(6px);transition:background 0.3s;}
.port-cat{font-size:0.6rem;letter-spacing:0.26em;text-transform:uppercase;color:rgba(255,255,255,0.55);margin-bottom:5px;transform:translateY(8px);opacity:0;transition:all 0.4s 0.05s;}
.port-name{font-family:'Cormorant Garamond',serif;font-size:1.45rem;font-weight:300;color:var(--white);transform:translateY(10px);opacity:0;transition:all 0.4s;}
.port-item:hover .port-cat,.port-item:hover .port-name{opacity:1;transform:translateY(0);}
.port-arrow{position:absolute;bottom:32px;right:32px;width:40px;height:40px;border:1px solid rgba(255,255,255,0.35);display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(8px);transition:all 0.35s 0.1s;}
.port-arrow svg{width:16px;height:16px;stroke:var(--white);fill:none;stroke-width:1.5;}
.port-item:hover .port-arrow{opacity:1;transform:translateX(0);}

/* ── PROCESS ── */
.process-section{padding:128px 60px;background:var(--white);}
.process-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:72px;}
.step{background:var(--cream);padding:52px 34px;position:relative;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);border-top:3px solid transparent;overflow:hidden;}
.step::before{content:'';position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity 0.4s;}
.step:hover{background:var(--white);border-top-color:var(--rg1);box-shadow:0 -4px 36px rgba(201,160,160,0.1);transform:translateY(-4px);}
.step:hover::before{opacity:1;}
.step-num{font-family:'Cormorant Garamond',serif;font-size:3.2rem;font-weight:300;line-height:1;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:26px;opacity:0.55;position:relative;z-index:1;}
.step-icon{margin-bottom:16px;position:relative;z-index:1;}
.step-icon svg{width:32px;height:32px;stroke:var(--rg1);fill:none;stroke-width:1.3;transition:transform 0.3s;}
.step:hover .step-icon svg{transform:scale(1.15);}
.step-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;color:var(--charcoal);margin-bottom:12px;position:relative;z-index:1;}
.step-desc{font-size:0.82rem;line-height:1.82;color:var(--muted);position:relative;z-index:1;}

/* ── TESTIMONIALS ── */
.testi-section{padding:128px 60px;background:var(--cream2);position:relative;overflow:hidden;}
.testi-bg-quote{position:absolute;top:-10px;left:-20px;font-family:'Cormorant Garamond',serif;font-size:28rem;font-weight:600;line-height:0.8;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0.04;pointer-events:none;user-select:none;}
.testi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:64px;}
.testi-card{background:var(--white);padding:44px 36px;position:relative;transition:all 0.4s;border-top:3px solid transparent;overflow:hidden;}
.testi-card::before{content:'';position:absolute;inset:0;background:var(--grad-soft);opacity:0;transition:opacity 0.4s;}
.testi-card:hover{border-top-color:var(--rg1);box-shadow:0 -4px 36px rgba(201,160,160,0.12);}
.testi-card:hover::before{opacity:1;}
.testi-stars{display:flex;gap:3px;margin-bottom:18px;position:relative;z-index:1;}
.testi-stars span{font-size:0.72rem;background:var(--grad-text);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.testi-text{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-style:italic;font-weight:300;line-height:1.72;color:var(--dark-mid);margin-bottom:28px;position:relative;z-index:1;}
.testi-author{display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
.testi-avatar{width:42px;height:42px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;color:white;flex-shrink:0;}
.testi-name{font-size:0.82rem;font-weight:400;color:var(--charcoal);}
.testi-role{font-size:0.7rem;color:var(--muted);margin-top:2px;}

/* ── CONTACT ── */
.contact-section{padding:128px 60px;background:var(--charcoal);display:grid;grid-template-columns:1fr 1fr;gap:80px;position:relative;overflow:hidden;}
.contact-section::before{content:'';position:a
